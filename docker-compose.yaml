services:
  # ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  # KAFKA
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${BOOTSTRAP_SERVERS},EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["29092:29092"]
    restart: unless-stopped
    env_file:
      - .env

  # TOPIC INITIALIZER
  topic-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "kafka-topics --bootstrap-server ${BOOTSTRAP_SERVERS}
      --create --if-not-exists --topic ${KAFKA_TOPIC} --partitions 1 --replication-factor 1"
    restart: "no"
    env_file:
      - .env

  # PRODUCER
  producer:
    build: .
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
    depends_on:
      kafka:
        condition: service_started
    env_file:
      - .env

  # NIFI
  nifi:
    # image: apache/nifi:latest
    build:
      context: .
      dockerfile: Dockerfile.nifi
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USER}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
    ports: ["8443:8443"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    env_file: [.env]


  # MYSQL
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["${MYSQL_PORT}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    env_file: [.env]

  # PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: ${MYSQL_HOST}
      PMA_PORT: ${MYSQL_PORT}
      UPLOAD_LIMIT: 256M
    ports: ["${PMA_PORT}:80"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    env_file: [.env]

volumes:
  mysql-data:
  nifi-conf:
  nifi-state:
  nifi-db:
  nifi-flowfile:
  nifi-content:
  nifi-provenance: